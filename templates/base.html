<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}FinWise – Smart Finance Tracker{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />

    <!-- Tailwind CSS (layout/spacing utilities — no GSAP, no AOS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: { DEFAULT: '#6366f1', 500: '#6366f1', 600: '#4f46e5' },
              accent:  { DEFAULT: '#a855f7', 500: '#a855f7' },
            },
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          }
        }
      }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Custom CSS (animations, components, theme vars) -->
    <link rel="stylesheet" href="/static/css/style.css" />

    {% block head %}{% endblock %}
</head>
<body class="font-sans min-h-screen">

<!-- Loading Screen -->
<div id="loading-screen" class="loading-screen">
    <div class="loading-inner">
        <div class="loading-icon">
            <i class="fa-solid fa-wallet"></i>
        </div>
        <h1 class="loading-title">FinWise</h1>
        <div class="loading-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
</div>

{% block body %}{% endblock %}

<!-- Toast Notification Container -->
<div id="toast-container"></div>

<!-- Main JS -->
<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
